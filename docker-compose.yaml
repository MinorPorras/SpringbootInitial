services:
  # ==========================================
  # SERVICIO 1: BASE DE DATOS (PostgreSQL)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: minor_user
      POSTGRES_PASSWORD: minor_password
      POSTGRES_DB: softengi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minor_user -d minor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # SERVICIO 2: APLICACIÓN SPRING BOOT
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/minor_db
      SPRING_DATASOURCE_USERNAME: minor_user
      SPRING_DATASOURCE_PASSWORD: minor_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update # Cambiar a 'validate' o 'none' en producción real
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge